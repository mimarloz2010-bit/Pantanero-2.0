name: Crear APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar archivos de Android
        run: |
          mkdir -p src/main/assets src/main/java/es/pantanero/app src/main/res/drawable
          cp index.html src/main/assets/index.html
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Pantanero"
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.7.3" }
          android {
              namespace = "es.pantanero.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "es.pantanero.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies { implementation("androidx.webkit:webkit:1.11.0") }
          EOF
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Pantanero" android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > src/main/java/es/pantanero/app/MainActivity.java <<'EOF'
          package es.pantanero.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> fileCb;
              private static final String HOST = "appassets.androidplatform.net";
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF040605);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, u));
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(p.createIntent(), 42); }
                          catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl("https://" + HOST + "/assets/index.html");
              }
              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 42 && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  } else super.onActivityResult(req, res, data);
              }
              @Override public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          cat > src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#040605" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#141C19" android:strokeColor="#3FC1A8" android:strokeWidth="2.5" android:pathData="M24,2.5a21.5,21.5 0 1,1 -0.01,0z"/>
              <path android:strokeColor="#3FC1A8" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M12,36.5q3,-2.2 6,0t6,0 6,0 6,0"/>
              <path android:fillColor="#E9F0EC" android:pathData="M9.5,25.5c6,-7.5 17.5,-8.5 24.5,-2.6l5.8,-4.6 -1.4,7.4 1.4,7.4 -5.8,-4.6c-7,5.9 -18.5,4.9 -24.5,-3z"/>
              <path android:fillColor="#040605" android:pathData="M13.9,25a1.6,1.6 0 1,0 3.2,0a1.6,1.6 0 1,0 -3.2,0z"/>
              <path android:strokeColor="#FF6B1A" android:strokeWidth="2.4" android:strokeLineCap="round" android:pathData="M25,4v11.5a3,3 0 0,1 -6,0"/>
          </vector>
          EOF
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pantanero-APK
          path: build/outputs/apk/debug/*.apk
