name: Crear APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar archivos de Android
        run: |
          mkdir -p src/main/assets src/main/java/es/pantanero/app src/main/res/drawable
          cp index.html src/main/assets/index.html
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Pantanero"
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.7.3" }
          android {
              namespace = "es.pantanero.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "es.pantanero.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Pantanero" android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > src/main/java/es/pantanero/app/MainActivity.java <<'EOF'
          package es.pantanero.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, u));
                          return true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          cat > src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1F5A55" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F7F8F3" android:pathData="M30,54 C38,40 58,38 70,48 L80,40 L78,54 L80,68 L70,60 C58,70 38,68 30,54 Z"/>
              <path android:fillColor="#1F5A55" android:pathData="M37,54 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 Z"/>
              <path android:fillColor="#E8590C" android:pathData="M53,26 h3 v12 h-3 Z"/>
          </vector>
          EOF
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pantanero-APK
          path: build/outputs/apk/debug/*.apk
