<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark}html,body{background:#040605}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pantanero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Karla:wght@400;500;700&display=swap">
<style>
/* Layout: app de móvil de una columna con barra de pestañas inferior; en escritorio, columna centrada de 560px */
/* Tema único negro: agua de noche, verde lago y naranja de señuelo */
:root{
  --bg:#040605; --surface:#0d1311; --surface-2:#141c19; --ink:#e9f0ec; --muted:#8a9a92; --line:#1e2925;
  --lake:#3fc1a8; --lake-soft:#10302a; --lure:#ff6b1a; --land:#18221e;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Karla",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.logo{width:44px;height:44px;flex:none}
.brandrow{display:flex;align-items:center;gap:10px}
.logo .fish{transform-origin:24px 25px;animation:swim 3.2s ease-in-out infinite}
@keyframes swim{50%{transform:translateX(1.5px) rotate(-3deg)}}
/* pantalla de inicio */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;animation:splashOut .45s var(--ease) 1.5s forwards}
#splash .in{display:grid;justify-items:center;gap:14px;position:relative}
#splash .logo{width:120px;height:120px;animation:pop .7s var(--ease) both}
#splash .ring{position:absolute;top:60px;left:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid var(--lake);border-radius:50%;opacity:0;animation:ripple 1.4s ease-out .3s}
#splash .ring.r2{animation-delay:.6s}
#splash .word{font-family:var(--display);font-weight:800;font-size:2.6rem;text-transform:uppercase;letter-spacing:.04em;animation:rise .6s var(--ease) .35s both}
#splash .word span{color:var(--lure)}
#splash .sub{color:var(--muted);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;animation:rise .6s var(--ease) .5s both}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
@keyframes ripple{from{transform:scale(.8);opacity:.8}to{transform:scale(2.6);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header.top{padding-block:20px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand span{color:var(--lure)}
.tag{color:var(--muted);font-size:.8rem;text-align:right;max-width:18ch;line-height:1.3}
@media (max-width:480px){.tag{display:none}}
@media (min-width:540px){.pagename{display:block}}
header.top .brand{font-size:clamp(1.7rem,7vw,2.4rem)}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.6rem;margin:18px 0 8px;letter-spacing:.02em;text-wrap:balance}
.search{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:.85rem;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip{transition:background .2s,border-color .2s,color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--bg)}
.card{transition:border-color .2s,transform .18s var(--ease),background .2s}
.card:active{transform:scale(.98)}
.fav.pop{animation:favpop .45s var(--ease)}
@keyframes favpop{40%{transform:scale(1.6) rotate(-15deg)}}
#view.anim>*{animation:rise .45s var(--ease) both}
#view.anim .card,#view.anim .spec,#view.anim .entry{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
#view.anim .pin{animation:drop .5s var(--ease) both;animation-delay:calc(var(--i,0)*12ms)}
.pin{transform-box:fill-box;transform-origin:center bottom}
@keyframes drop{from{transform:translateY(-14px) scale(.4);opacity:0}}
.pin:hover circle:last-of-type{r:7}
select.chip{appearance:none;padding-right:12px}
.count{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;margin:4px 0 8px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--lake)}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.card .where{color:var(--muted);font-size:.85rem;grid-column:1}
.card .sp{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:.75rem;padding:2px 8px;border-radius:6px;background:var(--lake-soft);color:var(--ink);font-weight:500}
.fav{grid-row:1/3;grid-column:2;align-self:start;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);padding:2px}
.fav.on{color:var(--lure)}
.km{font-family:var(--display);font-weight:600;font-size:1rem;color:var(--lake)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:linear-gradient(var(--bg) 78%,rgba(4,6,5,0));padding-block:12px 14px!important;align-items:center!important;justify-content:flex-start!important}
.menubtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-content:center;gap:5px;cursor:pointer;transition:transform .15s,border-color .2s}
.menubtn:active{transform:scale(.92)}
.menubtn span{display:block;width:20px;height:2px;border-radius:2px;background:var(--ink);transition:transform .3s var(--ease),opacity .2s}
.menubtn[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menubtn[aria-expanded="true"] span:nth-child(2){opacity:0}
.menubtn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.pagename{display:none;margin-left:auto;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.drawer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);animation:fade .25s ease both}
.drawer .dpanel{position:absolute;top:0;left:0;bottom:0;width:min(320px,86vw);box-sizing:border-box;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:slidein .38s var(--ease) both}
.drawer.closing{animation:fade .22s ease reverse both}
.drawer.closing .dpanel{animation:slideout .22s ease-in both}
@keyframes slidein{from{transform:translateX(-100%)}}
@keyframes slideout{to{transform:translateX(-100%)}}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dhead .brand{font-size:1.8rem}
.dhead .logo{width:38px;height:38px}
.dgroup{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 10px 6px}
.ditem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;background:none;border:none;color:var(--ink);font:inherit;cursor:pointer;transition:background .2s;animation:rise .4s var(--ease) both;animation-delay:calc(.08s + var(--i,0)*35ms)}
.ditem:hover{background:var(--surface-2)}
.ditem svg{flex:none;width:34px;height:34px;padding:7px;box-sizing:border-box;border-radius:10px;background:var(--bg);border:1px solid var(--line);stroke:var(--lake);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ditem b{display:block;font-size:.98rem}
.ditem small{display:block;color:var(--muted);font-size:.78rem}
.ditem[aria-current="page"]{background:var(--lake-soft)}
.ditem[aria-current="page"] b{color:var(--lake)}
.ditem[aria-current="page"] svg{stroke:var(--lure);border-color:var(--lure)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lure);outline-offset:2px}
/* mapa */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.mapbox svg{width:100%;height:auto;display:block}
.mapnote{color:var(--muted);font-size:.85rem;margin-top:8px}
/* ficha */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;box-sizing:border-box;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.pane h2{font-size:2.2rem;margin:4px 0 0;line-height:.95}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact b{display:block;font-family:var(--display);font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.fact small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.pane h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px}
.pane p{margin:0 0 8px;max-width:65ch}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.months div{text-align:center;font-size:.7rem;padding:6px 0;border-radius:4px;background:var(--land);color:var(--muted);font-weight:700}
.months div.hot{background:var(--lure);color:#fff}
.months div.ok{background:var(--lake-soft);color:var(--ink)}
.legend{display:flex;gap:12px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.close{float:right;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;font:inherit;font-weight:700;padding:4px 12px;cursor:pointer}
.warn{border-left:3px solid var(--lure);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:.85rem;color:var(--muted)}
/* especies */
.spec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}
.spec h3{margin:0;font-family:var(--display);font-size:1.4rem;text-transform:uppercase;font-weight:800}
.spec .lat{font-style:italic;color:var(--muted);font-size:.85rem}
.spec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:4px 0 0;font-size:.9rem}
.spec dt{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.spec dd{margin:0}
/* cuaderno */
form.log{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.log label{display:grid;gap:4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
form.log .full{grid-column:1/-1}
form.log input,form.log select{font:inherit;font-size:.95rem;text-transform:none;letter-spacing:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.btn{font:inherit;font-weight:700;background:var(--lure);color:#fff;border:none;border-radius:10px;padding:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.entry .w{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--lake);grid-row:1/3;grid-column:1;font-variant-numeric:tabular-nums;min-width:3.2ch}
.entry .t{font-weight:700;grid-column:-3/-2;min-width:0}
.entry .s{color:var(--muted);font-size:.85rem;grid-column:-3/-2;min-width:0}
.entry .x{grid-row:1/3;grid-column:-2/-1;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem}
.entry.hasph{grid-template-columns:56px auto 1fr auto}
.entry.hasph .w{grid-column:2}
.entry .ph{grid-row:1/3;grid-column:1;width:56px;height:56px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;background:var(--surface-2)}
.entry .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s var(--ease)}
.entry .ph:hover img{transform:scale(1.08)}
.photopick{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photopick .pickbtn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px dashed var(--lake);border-radius:10px;padding:10px 14px;cursor:pointer}
.photopick input{position:absolute;width:1px;height:1px;opacity:0}
.photopick .prev{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);animation:rise .35s var(--ease)}
.photopick .prev img{width:100%;height:100%;object-fit:cover}
.photopick .prev button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:.8rem;line-height:1}
.photopick small{color:var(--muted);font-size:.78rem;text-transform:none;letter-spacing:0}
.bigphoto{width:100%;border-radius:12px;display:block;margin-top:12px;background:var(--surface-2);min-height:120px}
.ex{font-size:.7rem;color:var(--lure);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.authcard h3{margin:0;font-family:var(--display);text-transform:uppercase;font-size:1.3rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;background:none;border:none;color:var(--muted);padding:9px;border-radius:8px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:var(--lake);color:var(--bg)}
.authform{display:grid;gap:10px}
.authform label{display:grid;gap:4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.authform input[type=email],.authform input[type=password]{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.authform .chk{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink)}
.authform .chk input{margin-top:3px;accent-color:var(--lake)}
.lnk{background:none;border:none;padding:0;font:inherit;color:var(--lake);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;justify-self:start}
.autherr{color:#ff8a7a;font-size:.88rem;background:rgba(255,90,70,.08);border:1px solid rgba(255,90,70,.3);border-radius:8px;padding:8px 10px}
.authok{color:var(--lake);font-size:.88rem;background:var(--lake-soft);border-radius:8px;padding:8px 10px}
.btn:disabled{opacity:.6;cursor:default}
.btn.red{background:#d63c2a}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-bottom:4px}
.who b{color:var(--ink);word-break:break-all}
.entry.ghost{opacity:.55}
.danger{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem;display:grid;gap:8px}
.danger p{margin:0;color:#ff8a7a}
.tankwrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid #1d3b40;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.5)}
#tank{display:block;width:100%;height:380px;touch-action:manipulation;cursor:pointer}
.feed{position:absolute;right:10px;bottom:10px;font:inherit;font-weight:700;font-size:.8rem;background:rgba(4,6,5,.7);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(4px);transition:transform .15s}
.feed:active{transform:scale(.93)}
.fishinfo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;animation:rise .35s var(--ease)}
.fishinfo canvas{width:90px;height:45px}
.fishinfo b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em}
.fishinfo .kg{color:var(--lake);font-weight:700}
.fishinfo .s{color:var(--muted);font-size:.85rem}
.fishinfo .fi{min-width:0}
.fishinfo .ph{width:52px;height:52px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in}
.fishinfo .ph img{width:100%;height:100%;object-fit:cover;display:block}
.legend2{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.legend2 .lg{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-size:.82rem}
.legend2 .lg canvas{width:44px;height:22px}
.legend2 .lg b{color:var(--lake)}
.pickemb{display:grid;gap:6px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.pickemb select{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.embbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px}
.embbox h3{margin:0 0 4px;font-family:var(--display);font-size:1.5rem;text-transform:uppercase;line-height:1.05}
.embbox .list{gap:0}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.brow:last-child{border-bottom:none}
.brow .bt{min-width:0}.brow b{display:block}.brow small{color:var(--muted);font-size:.82rem}
.brow .fav{grid-row:auto;grid-column:auto}
.bdot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 0 0 2px var(--surface-2)}
.mymine{margin:10px 0 0;font-size:.9rem;color:var(--muted)}.mymine b{color:var(--lure)}
.rig{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .2s,transform .15s;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.rig:hover{border-color:var(--lake)}.rig:active{transform:scale(.98)}
.rigsvg{width:100%;height:auto;background:var(--bg);border-radius:10px;display:block}
.rigsvg.big{margin:12px 0}
.rigsvg .ln{stroke:#d6e2dc;stroke-width:1.6;fill:none}
.rigsvg .tube{stroke:#3a5a52;stroke-width:6;fill:none;stroke-linecap:round}
.rigsvg .hk{stroke:#c9d2cf;stroke-width:2.2;fill:none;stroke-linecap:round}
.rigsvg .hair{stroke:#ff9a5c;stroke-width:1.4;fill:none;stroke-dasharray:3 2}
.rigsvg text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.rigname{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rigname b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em}
.lvl{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.lvl-básico{color:var(--lake)}.lvl-medio{color:#f2c230}.lvl-avanzado{color:var(--lure)}
ul.mat,ol.steps{margin:0 0 8px;padding-left:20px;display:grid;gap:6px}
ol.steps li::marker{color:var(--lure);font-weight:700}
.lurehead{display:flex;gap:12px;align-items:center}
.lureico{width:80px;height:48px;flex:none;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.lure .sp{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.seg4{grid-template-columns:repeat(4,1fr);margin-bottom:10px}
.subh{font-family:var(--display);text-transform:uppercase;font-size:1.25rem;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.subh span{font-family:var(--body);font-size:.75rem;color:var(--lake);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.seg4 button{font-size:.68rem;padding:9px 2px;letter-spacing:0}
.btag{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;vertical-align:2px;margin-left:4px}
.btag.art{color:#f2c230;border-color:rgba(242,194,48,.4)}
.bhead{display:flex;align-items:center;gap:12px}
.bmono{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.02em;color:hsl(var(--h) 80% 82%);
  background:linear-gradient(145deg,hsl(var(--h) 45% 26%),hsl(var(--h) 50% 14%));border:1px solid hsl(var(--h) 45% 38%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.35)}
.bweb{justify-self:start;font-weight:700;font-size:.88rem;color:var(--lake);text-decoration:underline;text-underline-offset:3px}
.prods{display:flex;flex-wrap:wrap;gap:6px}
.prod{display:grid;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.prod b{font-size:.9rem}.prod small{color:var(--muted);font-size:.75rem}
.layers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.layer{font:inherit;font-size:.78rem;font-weight:700;display:grid;justify-items:center;gap:5px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.layer i{display:block;width:30px;height:18px;border-radius:4px;background:linear-gradient(#0d4652,#041a1f);position:relative;overflow:hidden}
.layer i::after{content:"";position:absolute;left:4px;right:4px;height:4px;border-radius:2px;background:var(--lure)}
.l-sup i::after{top:2px}.l-media i::after{top:7px}.l-fondo i::after{bottom:2px}.l-all i::after{top:2px;bottom:2px;height:auto;opacity:.5}
.layer[aria-pressed="true"]{background:var(--lake-soft);color:var(--lake);border-color:var(--lake)}
.capa{display:inline-block;margin-top:4px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.c-sup{color:#f2c230}.c-media{color:var(--lake)}.c-fondo{color:#c9a37a}
.mods{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mods span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:100%}
.mods b{font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.card,.rig,.chip,.btn,.ditem,.layer,.seg button,.feed{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);transform:scale(0);pointer-events:none;animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
header.top{transition:box-shadow .3s,background .3s}
header.top.scrolled{box-shadow:0 1px 0 var(--line);background:rgba(4,6,5,.92);backdrop-filter:blur(8px)}
header.top .logo{transition:width .3s var(--ease),height .3s var(--ease)}
header.top.scrolled .logo{width:36px;height:36px}
header.top .brand{transition:font-size .3s var(--ease)}
header.top.scrolled .brand{font-size:1.6rem}
header.top{view-transition-name:cabecera}
::view-transition-old(root){animation:vtout .2s ease both}
::view-transition-new(root){animation:vtin .38s var(--ease) both}
@keyframes vtout{to{opacity:0;transform:translateY(-10px)}}
@keyframes vtin{from{opacity:0;transform:translateY(18px)}}
@media (hover:hover){.card::after,.rig::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s var(--ease);pointer-events:none}
 .card:hover::after,.rig:hover::after{transform:translateX(100%)}}
.mapland{animation:fade .6s ease both}
.maprio{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.capg{animation:fade .5s ease .4s both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
#splash .bub{position:absolute;bottom:-70px;width:8px;height:8px;border:1.5px solid var(--lake);border-radius:50%;opacity:0;animation:bub 1.6s ease-in var(--d) both}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translateY(-140px) translateX(var(--x))}}
#splash .wave{width:180px;height:14px;animation:rise .6s var(--ease) .6s both}
#splash .wave path{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1s ease .7s forwards}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sheet{animation:fade .25s ease both}
.sheet .pane{animation:up .4s var(--ease) both;border-top:1px solid var(--line)}
.sheet.closing{animation:fade .22s ease reverse both}
.sheet.closing .pane{animation:down .22s ease-in both}
.pane .fact,.pane .months div{animation:rise .4s var(--ease) both}
.pane .months div{animation-delay:calc(.15s + var(--i,0)*25ms)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#splash{display:none}}
</style>

    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);let d=c.toDataURL("image/jpeg",q);

      if(food.length){let best=food[0],bd=1e9;for(const p of food){const d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<bd){bd=d;best=p}}tx=best.x;ty=best.y;if(bd<.0012)best.eaten=true}
      else if((Math.abs(tx-f.x)<.03&&Math.abs(ty-f.y)<.03)||Math.random()<.002*dt){f.tx=.06+Math.random()*.88;f.ty=f.f.zone[0]+Math.random()*(f.f.zone[1]-f.f.zone[0])}
      const max=(.0011+f.boost*.004+(food.length?.0016:0))*f.f.spd*(reduce?.3:1);
      const wantVx=Math.max(-max,Math.min(max,(tx-f.x)*.03)),wantVy=Math.max(-max*.7,Math.min(max*.7,(ty-f.y)*.03));
      f.vx+=(wantVx-f.vx)*Math.min(1,.06*dt);f.vy+=(wantVy-f.vy)*Math.min(1,.06*dt);
      f.x=Math.max(.04,Math.min(.96,f.x+f.vx*dt));f.y=Math.max(.06,Math.min(.97,f.y+f.vy*dt));f.boost*=Math.pow(.97,dt);
      if(Math.abs(f.vx)>max*.25)f.dir=f.vx>0?1:-1; // no se gira a cada momento
      f.face+=(f.dir-f.face)*Math.min(1,.1*dt);
      const sx=Math.abs(f.face)<.15?(f.face<0?-.15:.15):f.face,S=f.spr,wag=Math.sin((t*(1+f.boost*2)+f.ph)*(4+f.f.spd*3+(food.length?3:0)))*.28;
      g.save();g.translate(f.x*W,f.y*sy);g.scale(sx,1);g.rotate(Math.max(-.25,Math.min(.25,f.vy*60))*Math.sign(sx));
      g.save();g.translate(-f.L*.31,0);g.rotate(wag);g.drawImage(S.tail,-S.tox,-S.toy,S.tw,S.th);g.restore();
      g.drawImage(S.body,-S.ox,-S.oy,S.bw,S.bh);
      if(tank.sel===f){g.strokeStyle="#ff6b1a";g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();g.ellipse(0,0,f.L*.62,Math.max(f.L*f.f.h,f.L*.24)*.85,0,0,7);g.stroke();g.setLineDash([])}
      g.restore()});
    food=food.filter(p=>p.y<.98&&!p.eaten);
    // burbujas
    g.strokeStyle="rgba(200,240,240,.55)";g.lineWidth=1;g.beginPath();
    bubbles.forEach(b=>{b.y-=b.s*.004*dt;if(b.y<0)b.y=1;const x=b.x*W+Math.sin(t*2+b.p)*4,y=b.y*sy;g.moveTo(x+b.r,y);g.arc(x,y,b.r,0,7)});g.stroke();
  };
  raf=requestAnimationFrame(step);
}

function rigCard(m,i){return `<button class="rig" data-rig="${m.k}" style="--i:${i}">

function vMontajes(){
  $("#view").innerHTML=`<h2>Montajes de carpa</h2>
    <p class="mapnote" style="margin:-4px 0 12px">Montajes de carpfishing. Toca uno para ver los materiales y cómo se hace paso a paso.</p>
    <div class="list">${MONT.map(rigCard).join("")}</div>
    <button class="chip" id="tobass" style="margin-top:14px">Ver montajes de black bass →</button>`;
  document.querySelectorAll("[data-rig]").forEach(b=>b.onclick=()=>openRig(b.dataset.rig,MONT,"carpa"));
  $("#tobass").onclick=()=>go("montbass");
}
function vMontBass(){
  $("#view").innerHTML=`<h2>Montajes de black bass</h2>
    <p class="mapnote" style="margin:-4px 0 12px">Las formas más usadas de montar vinilos y jigs. Toca uno para ver los materiales, el paso a paso y cómo moverlo.</p>
    <div class="list">${BASSRIGS.map(rigCard).join("")}</div>
    <button class="chip" id="tolures2" style="margin-top:14px">Ver señuelos para black bass →</button>`;
  document.querySelectorAll("[data-rig]").forEach(b=>b.onclick=()=>openRig(b.dataset.rig,BASSRIGS,"bass"));
  $("#tolures2").onclick=()=>{S.lure="bass";S.layer="";go("senuelos")};
}
function openRig(k,LIST,kind){
  const m=LIST.find(x=>x.k===k),sh=$("#sheet");
  sh.innerHTML=`<div class="pane" role="dialog" aria-modal="true" aria-label="${m.n}">
    <div class="grab"></div><button class="close" id="cl">Cerrar</button>
    <div class="count" style="margin:0">Montaje de ${kind==="bass"?"black bass":"carpa"} · ${m.lvl}</div><h2>${m.n}</h2>
    <svg viewBox="0 0 320 130" class="rigsvg big" role="img" aria-label="Dibujo del ${m.n}">${m.svg()}</svg>
    <p>${m.cuando}</p>
    <h4>Qué necesitas</h4><ul class="mat">${m.mat.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h4>Paso a paso</h4><ol class="steps">${m.pasos.map(x=>`<li>${x}</li>`).join("")}</ol>
    ${m.rec?`<h4>Cómo moverlo</h4><p>${m.rec}</p>`:""}
    <div class="warn">${kind==="bass"?"Si vas a soltar el pez, sujétalo por la mandíbula con la mano mojada y devuélvelo rápido al agua.":"Cuida a la carpa: usa moqueta o colchoneta para dejarla en el suelo, mójala y devuélvela al agua rápido."}</div></div>`;
  sh.classList.remove("closing");sh.hidden=false;
  const close=()=>{sh.classList.add("closing");setTimeout(()=>{sh.hidden=true;sh.innerHTML="";sh.classList.remove("closing")},220)};
  sh._close=close;$("#cl").onclick=close;sh.onclick=ev=>{if(ev.target===sh)close()};$("#cl").focus();
}

function vSenuelos(){
  const PRED=["bass","lucio","lucioperca","perca","siluro","trucha"],f=S.lure||"",cap=S.layer||"",
    list=SENU.filter(x=>(!f||x.sp.includes(f))&&(!cap||x.capa===cap));
  $("#view").innerHTML=`<h2>Señuelos para depredadores</h2>
    <div class="chips"><button class="chip" data-lure="" aria-pressed="${!f}">Todos los peces</button>${PRED.map(k=>`<button class="chip" data-lure="${k}" aria-pressed="${f===k}">${SP[k]}</button>`).join("")}</div>
    <div class="layers" role="group" aria-label="Capa de agua">
      ${[["","Todas"],["sup","Superficie"],["media","Media agua"],["fondo","Fondo"]].map(([k,n])=>`<button class="layer l-${k||"all"}" data-layer="${k}" aria-pressed="${cap===k}"><i></i>${n}</button>`).join("")}
    </div>
    <div class="count">${list.length} señuelo${list.length===1?"":"s"}${f?" para "+SP[f].toLowerCase():""}${cap?" · "+CAPA[cap].toLowerCase():""}</div>
    <div class="list">${list.map((x,i)=>`<div class="spec lure" style="--i:${i}">
      <div class="lurehead"><svg viewBox="0 0 80 48" class="lureico" aria-hidden="true">${LI[x.k]}</svg>
        <div style="min-width:0"><h3>${x.n}</h3><span class="capa c-${x.capa}">${CAPA[x.capa]}</span></div></div>
      <div class="sp">${x.sp.map(s=>`<span class="pill">${SP[s]}</span>`).join("")}</div>
      <p style="margin:0">${x.d}</p>
      <dl><dt>Cómo moverlo</dt><dd>${x.rec}</dd><dt>Cuándo</dt><dd>${x.cuando}</dd><dt>Tamaño</dt><dd>${x.tam}</dd><dt>Colores</dt><dd>${x.color}</dd></dl>
      ${x.mod?`<div class="mods"><span>Modelos conocidos</span>${x.mod.map(m=>`<b>${m}</b>`).join("")}</div>`:""}
      ${x.rig?`<button class="chip" data-rigto="${x.rig}" style="justify-self:start">Ver cómo se monta →</button>`:""}</div>`).join("")||`<p class="mapnote">No hay señuelos con esos filtros. Prueba a quitar alguno.</p>`}</div>
    <p class="mapnote">Lleva siempre unos alicates para quitar el anzuelo rápido y devolver el pez en buen estado. Los modelos son ejemplos conocidos, no publicidad.</p>`;
  document.querySelectorAll("[data-lure]").forEach(b=>b.onclick=()=>{S.lure=b.dataset.lure;vSenuelos()});
  document.querySelectorAll("[data-layer]").forEach(b=>b.onclick=()=>{S.layer=b.dataset.layer;vSenuelos()});
  document.querySelectorAll("[data-rigto]").forEach(b=>b.onclick=()=>{go("montbass");setTimeout(()=>openRig(b.dataset.rigto,BASSRIGS,"bass"),250)});
}

function openPrivacy(){
  const sh=$("#sheet");
  sh.innerHTML=`<div class="pane" role="dialog" aria-modal="true" aria-label="Política de privacidad">
    <div class="grab"></div><button class="close" id="cl">Cerrar</button>
    <h2>Privacidad</h2>
    <h4>Qué datos guardamos</h4><p>Tu email, una contraseña cifrada que nadie puede leer, y las capturas que apuntes en el cuaderno (fecha, embalse, especie, peso, señuelo y la foto si añades una). Al guardar una foto, la app la reduce y le quita los datos ocultos, como la ubicación GPS.</p>
    <h4>Para qué</h4><p>Solo para que puedas entrar en tu cuenta y ver tu cuaderno desde cualquier móvil. No usamos tus datos para publicidad ni se los damos a nadie.</p>
    <h4>Dónde se guardan</h4><p>En Firebase, un servicio de Google, en servidores de la Unión Europea. Cada persona solo puede ver sus propias capturas.</p>
    <h4>Menores de edad</h4><p>Si tienes menos de 14 años, necesitas el permiso de tu padre, madre o tutor para crear una cuenta.</p>
    <h4>Tus derechos</h4><p>Puedes borrar tu cuenta y todos tus datos cuando quieras con el botón «Borrar mi cuenta y mis datos» del cuaderno. También puedes pedir ver, corregir o borrar tus datos escribiendo al responsable de Pantanero.</p>
  </div>`;
  sh.classList.remove("closing");sh.hidden=false;
  const close=()=>{sh.classList.add("closing");setTimeout(()=>{sh.hidden=true;sh.innerHTML="";sh.classList.remove("closing")},220)};
  sh._close=close;$("#cl").onclick=close;sh.onclick=ev=>{if(ev.target===sh)close()};$("#cl").focus();
}
function openSheet(id){
  const e=byId(id),sh=$("#sheet");
  sh.innerHTML=`<div class="pane" role="dialog" aria-modal="true" aria-label="${esc(e.n)}">
    <div class="grab"></div>
    <button class="close" id="cl">Cerrar</button>
    <div class="count" style="margin:0">${esc(e.ccaa==="Andalucía"?"Andalucía · "+e.prov:e.ccaa)}</div>
    <h2>${esc(e.n)}</h2>
    <div class="where" style="color:var(--muted)">${e.apodo?esc(e.apodo)+" · ":""}${esc(e.prov)}</div>
    <div class="facts">
      <div class="fact"><b>~${e.km2}</b><small>km² de lámina</small></div>
      <div class="fact"><b>${e.sp.length}</b><small>Especies</small></div>
      <div class="fact"><b>${e.lat.toFixed(2)}°</b><small>Latitud N</small></div>
    </div>
    <p>${esc(e.d)}</p>
    <h4>Especies</h4>
    <div class="sp" style="display:flex;flex-wrap:wrap;gap:4px">${e.sp.map(s=>`<span class="pill">${SP[s]}</span>`).join("")}</div>
    <h4>Mejores meses</h4>
    <div class="months">${e.m.map((v,i)=>`<div style="--i:${i}" class="${v===2?"hot":v===1?"ok":""}" title="${v===2?"Muy buena":v===1?"Buena":"Floja"}">${MES[i]}</div>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--lure)"></i>Muy buena</span><span><i style="background:var(--lake-soft)"></i>Buena</span><span><i style="background:var(--land)"></i>Floja</span></div>
    <h4>Cómo pescarlo</h4><p>${esc(e.t||e.sp.map(s=>SP[s]+": "+SPECIES.find(x=>x.k===s).tec.toLowerCase()).join(". ")+".")}</p>
    <h4>A tener en cuenta</h4><p>${esc(e.acc)}</p>
    <p><a href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lon}" target="_blank" rel="noopener" style="color:var(--lake);font-weight:700">Abrir en Google Maps ↗</a></p>
    <div class="warn">Necesitas licencia de pesca de la comunidad autónoma (en Andalucía, de la Junta de Andalucía). Las normas (cupos, tallas, pesca sin muerte o sacrificio de especies invasoras) cambian según la comunidad y el año: consúltalas siempre antes de ir.</div>
  </div>`;
  sh.classList.remove("closing");sh.hidden=false;countUp(sh);
  const close=()=>{if(sh.classList.contains("closing"))return;sh.classList.add("closing");setTimeout(()=>{sh.hidden=true;sh.innerHTML="";sh.classList.remove("closing")},220)};
  sh._close=close;$("#cl").onclick=close;sh.onclick=ev=>{if(ev.target===sh)close()};
  document.onkeydown=ev=>{if(ev.key==="Escape"&&!sh.hidden)close()};
  $("#cl").focus();
}
$("#menubtn").onclick=()=>$("#drawer").hidden?openMenu():closeMenu();
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeMenu()});
initFB();
render(true);
setTimeout(()=>{const s=$("#splash");if(s)s.remove()},2100);
